name: Bug report
description: Report a reproducible software or workflow problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command and the smallest non-sensitive input that reproduces it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and dependency details.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed private datasets, credentials and personal information.
          required: true
